<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Rich menu @facadex</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 2500px; height: 1686px; box-sizing: border-box; background: #292724; font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif; padding: 36px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 28px;">

  <div style="background: #D4B596; border-radius: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; color: #2A2018;">

    <div style="font-size: 92px; font-weight: 800; line-height: 1;">ขอใบเสนอราคา</div>
    <div style="font-size: 44px; font-weight: 600; opacity: 0.75;">งานใหม่ · ส่งแบบมาได้</div>
  </div>

  <div style="background: #D4B596; border-radius: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; color: #2A2018;">
    <svg width="220" height="220" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V8l7-4 7 4v13"></path><path d="M9 21v-5h6v5"></path><path d="M9 11h.01M15 11h.01"></path></svg>

    <div style="font-size: 44px; font-weight: 600; opacity: 0.75;">ความคืบหน้า · รูปล่าสุด</div>
  </div>

  <div style="background: #D4B596; border-radius: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; color: #2A2018;">
    <svg width="220" height="220" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg>

  </div>

  <div style="background: #4A4640; border-radius: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: #F4F1EC;">
    <svg width="180" height="180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 3v2h6V3"></path><path d="M9 11h6M9 15h4"></path></svg>
    <div style="font-size: 80px; font-weight: 700; line-height: 1.1;">สถานะแจ้งซ่อม</div>
  </div>

  <div style="background: #4A4640; border-radius: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: #F4F1EC;">
    <svg width="180" height="180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>

  <div style="background: #4A4640; border-radius: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: #F4F1EC;">
